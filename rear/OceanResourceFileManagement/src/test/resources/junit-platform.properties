junit.jupiter.execution.parallel.enabled = true # 启用并行执行
junit.jupiter.execution.parallel.mode.default = same_thread # 测试内部方法为同一线程执行，即串行执行
junit.jupiter.execution.parallel.mode.classes.default = concurrent # 测试类为并行执行
junit.jupiter.execution.parallel.config.strategy = fixed # 并行策略为固定线程池
junit.jupiter.execution.parallel.config.fixed.parallelism = 10 # 线程池大小为10