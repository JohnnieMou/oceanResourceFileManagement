server:
  port: 9999

spring:
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/orfm?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
      username: root
      password: 123456
  servlet:
    multipart:
      enabled: true  # 启用文件上传支持
      max-file-size: 100MB  # 单个文件的最大上传大小
      max-request-size: 200MB  # 整个请求的最大大小（包括所有文件和表单数据）
  cache:
    type: redis
    redis:
      time-to-live: 3600000 # 缓存过期时间，单位毫秒
  redis:
    host: localhost
    port: 6379
    password:
    database: 2
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

mybatis-plus:
  type-aliases-package: com.example.pojo.entity
  type-handlers-package: com.example.handler
  global-config:
    db-config:
      id-type: auto
  configuration:
    call-setters-on-nulls: true # 解决查询字段值为null而不显示的问题
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发环境打印SQL

knife4j:
  enable: true
  basic:
    enable: true
    username: admin
    password: 123


baidu:
  app-id: 20240813002122152
  security-key: VWTPJL_C5T7FU7rM5eOU

storage:
  mode: minio
  minio:
    endpoint: http://localhost:9005
    accessKey: minioadmin
    secretKey: minioadmin
    bucketName: "orfm"


